# CI and automated tests. Always local; paths are overridden to temp dirs in pytest.
environment: test
storage:
  mode: local
  local_root: ${HC_LOCAL_ROOT:-data/lake-test}
  landing: ${HC_LANDING:-data/sample}
  adls_uri: abfss://claims@sthcclaimstest.dfs.core.windows.net/lake
  landing_adls: abfss://claims@sthcclaimstest.dfs.core.windows.net/landing
catalog:
  mode: local
  name: healthcare_test
  bronze_schema: bronze
  silver_schema: silver
  gold_schema: gold
  audit_schema: audit
spark:
  app_name: hc-claims-test
  master: local[2]
  shuffle_partitions: 2
  driver_memory: 2g
pipeline:
  name: hc_medallion
  amount_tolerance: "0.01"
  dq_fail_rate_alert_threshold: 0.05
  retry_attempts: 2
  retry_backoff_seconds: 0.01
  scd2_epoch: "2020-01-01"
  brand_awp_discount: "0.16"
alerts:
  webhook_url: ""
secrets:
  mode: env
  scope: hc-kv-test
logging:
  dir: ${HC_LOG_DIR:-data/logs-test}
