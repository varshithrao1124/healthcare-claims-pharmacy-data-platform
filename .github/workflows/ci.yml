name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint and format
        run: |
          ruff check src tests dashboard
          ruff format --check src tests dashboard

      - name: Validate ADF JSON and bundle YAML
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path("adf").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("json", path)
          yaml.safe_load(Path("databricks.yml").read_text(encoding="utf-8"))
          for path in Path("conf").glob("*.yml"):
              yaml.safe_load(path.read_text(encoding="utf-8"))
          print("yaml ok")
          PY

      - name: Data generator smoke test
        env:
          PYTHONPATH: src
        run: python -m hc_platform.cli generate --scale tiny --output /tmp/hc-smoke --seed 42

      - name: Pytest with coverage
        env:
          PYTHONPATH: src
          SPARK_LOCAL_IP: 127.0.0.1
        run: pytest tests --cov=hc_platform --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore
